<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>达人素材下载器</title>
<style>
  :root { --primary:#3370FF; --bg:#F5F7FA; --card:#fff; --text:#1f2329; --muted:#646a73; --ok:#00B42A; --warn:#FF7D00; --err:#F53F3F; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:16px; min-height:420px; }
  .card { background:var(--card); border-radius:10px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  h1 { font-size:16px; display:flex; align-items:center; gap:8px; }
  h1 .logo { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,#3370FF,#6B9FFF); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; }
  .sub { font-size:12px; color:var(--muted); margin-top:4px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], textarea { width:100%; border:1px solid #D5D8DD; border-radius:6px; padding:8px 10px; font-size:13px; font-family:inherit; background:#fff; color:var(--text); }
  input[type=text]:focus, textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px rgba(51,112,255,.15); }
  textarea { resize:vertical; min-height:88px; line-height:1.6; }
  .row { display:flex; gap:8px; align-items:center; }
  .row input { flex:1; }
  .btn { background:var(--primary); color:#fff; border:none; border-radius:6px; padding:9px 18px; font-size:14px; cursor:pointer; font-weight:500; transition:opacity .15s; }
  .btn:hover { opacity:.9; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.full { width:100%; margin-top:10px; }
  .stat { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .stat span { font-size:12px; padding:3px 10px; border-radius:20px; background:#F2F3F5; color:var(--muted); }
  .stat b { font-weight:600; }
  .stat .s-ok b { color:var(--ok); } .stat .s-err b { color:var(--err); } .stat .s-skip b { color:var(--warn); }
  #log { max-height:240px; overflow-y:auto; font-size:12px; line-height:1.9; font-family:"SF Mono",Menlo,Consolas,monospace; }
  .log-line { display:flex; gap:8px; padding:2px 0; border-bottom:1px dashed #EFF0F1; }
  .log-line .status { min-width:52px; font-weight:600; }
  .st-published { color:var(--ok); } .st-exists { color:var(--warn); } .st-skipped { color:var(--muted); } .st-error { color:var(--err); }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; margin-left:6px; }
  .badge.b-on { background:#E8F3FF; color:var(--primary); }
  .badge.b-off { background:#F2F3F5; color:var(--muted); }
  .tip { font-size:12px; color:var(--muted); background:#F8FAFF; border:1px dashed #C9D8FF; border-radius:6px; padding:8px 10px; margin-top:10px; line-height:1.7; }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(51,112,255,.25); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1><span class="logo">素</span>达人素材下载器</h1>
  <div class="sub">粘贴金山文档(kdocs.cn)分享链接，自动抓取表格内素材图片并写入当前多维表格</div>

  <label>后端服务地址（本机智能体，一般不用改）</label>
  <div class="row">
    <input type="text" id="apiBase" placeholder="http://localhost:5210">
    <button class="btn" id="saveApi" style="padding:9px 14px;font-size:12px;">保存</button>
  </div>

  <label>目标表格 <span class="badge b-off" id="tableBadge">未检测到表格上下文</span></label>
  <div class="row">
    <input type="text" id="appToken" placeholder="App Token（默认用后端配置，可留空）">
  </div>
  <div class="row" style="margin-top:6px;">
    <input type="text" id="tableId" placeholder="Table ID（默认用后端配置，可留空）">
  </div>

  <label>素材链接（每行一个，支持完整链接或纯 link_id）</label>
  <textarea id="links" placeholder="https://www.kdocs.cn/l/xxxxxxx&#10;https://www.kdocs.cn/l/yyyyyyy&#10;或直接粘贴 link_id"></textarea>

  <button class="btn full" id="startBtn">⬇ 开始下载素材</button>

  <div class="stat" id="stat" style="display:none;">
    <span class="s-ok">成功 <b id="stOk">0</b></span>
    <span class="s-skip">无素材 <b id="stSkip">0</b></span>
    <span class="s-skip">已存在 <b id="stExists">0</b></span>
    <span class="s-err">失败 <b id="stErr">0</b></span>
  </div>
</div>

<div class="card">
  <label>处理日志</label>
  <div id="log"><div class="sub">等待任务…</div></div>
</div>

<div class="tip">
  💡 <b>使用说明：</b>① 本插件默认将素材发布到「飞书配置」里设置的表格；② 如果你在飞书配置页填过 App Token / Table ID，留空即可；③ 想发到当前打开的表，请在上方填写该表的 App Token 和 Table ID（地址栏 base/ 后和 table= 后的值）；④ 已发布过的链接会自动跳过，不会重复。
</div>

<script>
const $ = id => document.getElementById(id);
const LS_KEY = 'kd_downloader_api_base';

function log(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'log-line';
  div.innerHTML = text;
  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
}

// ---------- 后端地址 ----------
$('apiBase').value = localStorage.getItem(LS_KEY) || 'http://localhost:5210';
$('saveApi').addEventListener('click', () => {
  const v = $('apiBase').value.trim().replace(/\/+$/, '');
  if (/^https?:\/\/.+/.test(v)) { localStorage.setItem(LS_KEY, v); log('✅ 后端地址已保存: ' + v); }
  else log('❌ 地址格式不正确', 'st-error');
});

// ---------- 读取飞书表格上下文 ----------
async function detectTable() {
  try {
    if (!window.bitable || !window.bitable.base) {
      $('tableBadge').className = 'badge b-off';
      $('tableBadge').textContent = '非插件容器（预览模式）';
      return;
    }
    const sel = await window.bitable.base.getSelection();
    if (sel && sel.tableId) {
      $('tableId').placeholder = 'Table ID（检测到: ' + sel.tableId + '）';
      $('tableBadge').className = 'badge b-on';
      $('tableBadge').textContent = '已检测到当前表';
      // 部分版本可读 appToken
      try {
        const info = window.bitable.base.info || {};
        if (info.appToken) { $('appToken').placeholder = 'App Token（检测到: ' + info.appToken + '）'; }
      } catch (e) {}
    }
  } catch (e) { /* 静默 */ }
}
detectTable();

// ---------- 开始下载 ----------
$('startBtn').addEventListener('click', async () => {
  const raw = $('links').value;
  const links = raw.split('\n').map(s => s.trim()).filter(Boolean);
  if (!links.length) { log('❌ 请先粘贴至少一个链接', 'st-error'); return; }

  const apiBase = $('apiBase').value.trim().replace(/\/+$/, '');
  const btn = $('startBtn');
  btn.disabled = true; btn.textContent = '⏳ 处理中，请稍候…';
  $('stat').style.display = 'flex';
  $('log').innerHTML = '';

  const body = {
    links,
    app_token: $('appToken').value.trim(),
    table_id: $('tableId').value.trim(),
  };

  log(`🚀 开始处理 ${links.length} 条链接 → ${apiBase}/api/kdocs/fetch`);
  try {
    const resp = await fetch(apiBase + '/api/kdocs/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!data.success) { log('❌ 接口错误: ' + (data.msg || JSON.stringify(data)), 'st-error'); return; }

    $('stOk').textContent = data.ok;
    $('stSkip').textContent = data.skipped;
    $('stExists').textContent = data.exists;
    $('stErr').textContent = data.error;

    (data.results || []).forEach(r => {
      const cls = r.status === 'published' ? 'st-published'
        : r.status === 'exists' ? 'st-exists'
        : r.status === 'skipped' ? 'st-skipped' : 'st-error';
      const label = { published: '✅ 发布', exists: '⏭ 已存在', skipped: '➖ 无素材', error: '❌ 失败' }[r.status] || r.status;
      const img = r.count ? `（${r.count}张）` : '';
      log(`<span class="status ${cls}">${label}</span><span>${r.link} ${img} ${r.detail || ''}</span>`);
    });
    log('🏁 全部处理完成。点击表格顶部的「刷新」查看新素材！');
  } catch (e) {
    log('❌ 连接失败: ' + e.message, 'st-error');
    log('💡 请确认：① 本机智能体(5210)正在运行 ② 用飞书客户端/网页打开时能访问 http://localhost:5210', 'st-error');
  } finally {
    btn.disabled = false; btn.textContent = '⬇ 开始下载素材';
  }
});
</script>
</body>
</html>
